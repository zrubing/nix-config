# The `my-minimal` agent preset: a fixed-prompt coding-agent composition —
# the shipped `minimal` preset plus the model-facing `web_search` tool, the
# preset-local `start_process` background-process tool, and a deterministic
# (pi-blackhole) compaction backend.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes the
# persistent shell (`bash` on POSIX, `pwsh` on win32), `str_replace_editor`,
# `web_search`, `start_process` (background processes), and `recall` (session
# history + file search). Context compaction uses the pi-blackhole deterministic
# backend: the @jojo/dsh-blackhole package's `lib/compaction.js` imports
# pi-blackhole's compile() (bundled by nix from the flake input) and subclasses
# `BasicCompactionEngine` so dsh's pressure / `/compact` / `<compacted-summary>`
# framing stay, but summarization is free and structural instead of an
# `llm.stream()` call. Observational memory (observer/reflector/dropper) is
# re-expressed over dsh's ctx.llm and injected into the summary; `recall`
# recovers what the compaction dropped.
#
# Managed by nix (modules/home/dsh): do not edit ~/.dsh/.agent-presets/my-minimal
# in place — edit this file and rebuild (home-manager activation re-links it;
# dsh picks the new generation up for the NEXT session on this preset).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# Exactly one shell stack mounts per host: the bash stack gates off win32 and
# its pwsh twin gates off POSIX, mirroring the one-shot shell rows.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# Web search. The `web` service and its `deepseek-official` search provider
# (DEEPSEEK_API_KEY, rendered into dsh.env by sops) stay in the HOST
# composition; only this model-facing tool is per-session. `fetch` stays
# disabled: the shipped deployment mounts no fetch provider, and enabling it
# here would register a tool that always fails. `complete: true` on the persona
# suppresses the tool-web guidance section, so if the model needs usage
# instructions, append them to the persona text above.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── background processes ────────────────────────────────────────────────────

# The agent-facing half of aliou's pi-processes, ported to dsh's own seams: pi
# extensions cannot load here (dsh's only pi-related package, dsh-llm-pi-ai, is
# an LLM API adapter, not an extension host), so `start_process` re-expresses
# the spawn-without-blocking workflow over the host shell executor and the
# generic `ctx.jobs` runtime. The jobs REGISTRY stays on the host plane
# (`dsh-jobs-local` in dsh-base); the producer resolves it with ctx.get, and the
# `tool-jobs` row supplies the collection tools plus completion notices. The web
# UI's session-header jobs list (dsh-client-ui-jobs) shows running and finished
# processes — the dsh counterpart of pi-processes' process dock. The persistent
# PTY shell above stays free for foreground work.
#
# The producer row loads its module through a relative specifier, so the file
# travels with this preset; nix builds it beside a node_modules shim resolving
# the harness's own @deepseek-ai/* dependencies (see modules/home/dsh).
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-processes
  name: './tool-processes.js'

# ── pi-blackhole (recall + observational memory + commands) ─────────────────
# The agent-facing half of pi-blackhole beyond the deterministic compaction:
# the `recall` tool (session/file search via the imported pi-blackhole core),
# the observational-memory workers (observer/reflector/dropper, re-expressed
# over dsh's ctx.llm), and the /blackhole* commands. This row sits in the
# agent scope (NOT inside the compaction isolate group below); the compaction
# backend row mounts ./dsh-blackhole/lib/compaction.js and imports the same
# bundled core.
- id: blackhole
  name: './dsh-blackhole/lib/index.js'

# ── deterministic compaction ─────────────────────────────────────────────────
#
# dsh ships a compaction seam (ctx.compaction) with an LLM backend
# (dsh-compaction-basic). This preset omits the shipped default and mounts a
# preset-local backend instead: ./dsh-blackhole/lib/compaction.js subclasses
# BasicCompactionEngine and overrides ONLY summarize(), replacing the LLM stream
# call with pi-blackhole's deterministic compile() — an LLM-free structural
# summary. Pressure thresholds, the /compact command, the <compacted-summary>
# framing, and the tool-result pruner all stay as dsh ships them; this is a
# backend swap, not a reimplementation.
#
# `tool-result-pruner` shares this realm because compaction-basic reads it through
# ctx.get. `tokenMeter` is deliberately NOT here: the meter stays on the HOST plane
# and the rows below resolve that one instance.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # 确定性压缩后端源码在 preset 内符（./dsh-blackhole/lib/compaction.js，@jojo/dsh-blackhole
    # 包产物），覆写 BasicCompactionEngine 的 summarize()，导入 pi-blackhole 的 compile()。
    - id: blackhole-compact
      name: './dsh-blackhole/lib/compaction.js'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
