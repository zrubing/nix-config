# The `my-minimal` agent preset DELTA — the rows this preset adds on top of the
# shipped `minimal` preset. The generated composition is:
#
#   upstream `minimal` (persona / persistent-shell / filesystem)  ← read from the
#   deepseek-harness-src flake input at eval time, so upstream updates flow
#   through on rebuild
#   + this file's rows (web_search, skill catalog + loader, start_process jobs,
#   pi-blackhole, deterministic compaction)
#
# The FULL preset is the shipped `minimal` plus these delta rows. The persona is
# the complete system prompt, so global identity, Web orientation, tool guidance,
# and later assembly listeners cannot add prompt text. Runtime context snapshots
# are suppressed for this preset, and the model composes the persistent shell
# (`bash` on POSIX, `pwsh` on win32), `str_replace_editor`, `web_search`, the
# `skill` loader (session skill catalog), `start_process` (background
# processes), and `recall` (session history + file search). Context compaction
# uses the pi-blackhole deterministic backend: the @jojo/dsh-blackhole
# package's `lib/compaction.js` imports pi-blackhole's
# compile() (bundled by nix from the flake input) and subclasses
# `BasicCompactionEngine` so dsh's pressure / `/compact` / `<compacted-summary>`
# framing stay, but summarization is free and structural instead of an
# `llm.stream()` call. Observational memory (observer/reflector/dropper) is
# re-expressed over dsh's ctx.llm and injected into the summary; `recall`
# recovers what the compaction dropped.
#
# Managed by nix (modules/home/dsh): do not edit ~/.dsh/.agent-presets/my-minimal
# in place. `agent.cordis.yml` is a generated artifact (upstream `minimal` +
# this file, concatenated in default.nix). Edit THIS file for the delta rows and
# rebuild (home-manager activation re-links it; dsh picks the new generation up
# for the NEXT session on this preset).

# Web search. The `web` service and its `deepseek-official` search provider
# (DEEPSEEK_API_KEY, rendered into dsh.env by sops) stay in the HOST
# composition; only this model-facing tool is per-session. `fetch` stays
# disabled: the shipped deployment mounts no fetch provider, and enabling it
# here would register a tool that always fails. `complete: true` on the persona
# suppresses the tool-web guidance section, so if the model needs usage
# instructions, append them to the persona text above.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── workspace instructions (AGENTS.md) ───────────────────────────────────────
# User-global $DSH_HOME/AGENTS.md plus the project-chain AGENTS.md/CLAUDE.md
# files become a durable baseline in the first request (byte-budget capped).
# The user-global file declares OpenBao (bao) usage — env-var provenance,
# LDAP login, and dynamic MySQL credential flow — see ~/.dsh/AGENTS.md
# (declared via home.file in modules/home/dsh).
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── skills ──────────────────────────────────────────────────────────────────
# The skill REGISTRY (@deepseek-ai/dsh-skill) lives in the HOST composition and
# is layered per scope: these rows register into THIS preset's layer of it, so
# they need no realm. `skill-filesystem` contributes local-root discovery for
# agents on this preset (default config → default roots, incl. ~/.agents/skills
# and ~/.dsh/skills), and `tool-skill` gives the model the session catalog and
# the `skill` loader tool.
#
# The catalog and loaded bodies are NOT system-prompt sections: `tool-skill`
# injects the catalog as a durable user-role message at agent/pre-step and
# renders a loaded skill into the tool result. So the `complete: true` persona
# (which restores only the persona as the sole prompt SECTION) does NOT suppress
# them — the `skill` tool stays visible and the catalog still appears. Skill-
# specific usage guidance rides in each skill's own body, not in the persona.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── background processes ────────────────────────────────────────────────────

# The agent-facing half of aliou's pi-processes, ported to dsh's own seams: pi
# extensions cannot load here (dsh's only pi-related package, dsh-llm-pi-ai, is
# an LLM API adapter, not an extension host), so `start_process` re-expresses
# the spawn-without-blocking workflow over the host shell executor and the
# generic `ctx.jobs` runtime. The jobs REGISTRY stays on the host plane
# (`dsh-jobs-local` in dsh-base); the producer resolves it with ctx.get, and the
# `tool-jobs` row supplies the collection tools plus completion notices. The web
# UI's session-header jobs list (dsh-client-ui-jobs) shows running and finished
# processes — the dsh counterpart of pi-processes' process dock. The persistent
# PTY shell above stays free for foreground work.
#
# The producer row loads its module through a relative specifier, so the file
# travels with this preset; nix builds it beside a node_modules shim resolving
# the harness's own @deepseek-ai/* dependencies (see modules/home/dsh).
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-processes
  name: './tool-processes.js'

# ── pi-blackhole (recall + observational memory + commands) ─────────────────
# The agent-facing half of pi-blackhole beyond the deterministic compaction:
# the `recall` tool (session/file search via the imported pi-blackhole core),
# the observational-memory workers (observer/reflector/dropper, re-expressed
# over dsh's ctx.llm), and the /blackhole* commands. This row sits in the
# agent scope (NOT inside the compaction isolate group below); the compaction
# backend row mounts ./dsh-blackhole/lib/compaction.js and imports the same
# bundled core.
- id: blackhole
  name: './dsh-blackhole/lib/index.js'

# ── deterministic compaction ─────────────────────────────────────────────────
#
# dsh ships a compaction seam (ctx.compaction) with an LLM backend
# (dsh-compaction-basic). This preset omits the shipped default and mounts a
# preset-local backend instead: ./dsh-blackhole/lib/compaction.js subclasses
# BasicCompactionEngine and overrides ONLY summarize(), replacing the LLM stream
# call with pi-blackhole's deterministic compile() — an LLM-free structural
# summary. Pressure thresholds, the /compact command, the <compacted-summary>
# framing, and the tool-result pruner all stay as dsh ships them; this is a
# backend swap, not a reimplementation.
#
# `tool-result-pruner` shares this realm because compaction-basic reads it through
# ctx.get. `tokenMeter` is deliberately NOT here: the meter stays on the HOST plane
# and the rows below resolve that one instance.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # 确定性压缩后端源码在 preset 内符（./dsh-blackhole/lib/compaction.js，@jojo/dsh-blackhole
    # 包产物），覆写 BasicCompactionEngine 的 summarize()，导入 pi-blackhole 的 compile()。
    - id: blackhole-compact
      name: './dsh-blackhole/lib/compaction.js'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
