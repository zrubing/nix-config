name: my-standard
description: 上游 standard 的全部编码能力（persona / 文件与搜索工具 / 后台进程 / skills / goals / 计划模式 / delegation / 子 agent / workflows / todo / web / 插件市场），其中后台进程控制换成 pi-process 的 process（start/list/output/logs/kill/clear + per-process 告警与 logWatches）；另加 pi-blackhole 确定性压缩、recall 会话检索、观测记忆，以及 ast_grep 结构化搜索。
order: 3
