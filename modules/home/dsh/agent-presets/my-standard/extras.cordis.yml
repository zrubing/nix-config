# The `my-standard` agent preset DELTA — the rows this preset's declaration adds
# on top of the shipped `standard` preset (the full coding agent, no PTC
# presentation).
# The declared `config.plugins` list is:
#
#   shipped `standard.patch.yml` plugins (persona / pwsh+bash / fs + fs-search /
#   jobs / schedule / skills / goals / plan mode / delegation / subagents /
#   workflows / ask-user / todo / web / plugin manager)          ← read from the
#   web-app bundle's presets/ at BUILD time (pkgs/dsh-local/presets.nix), so
#   upstream updates flow through on rebuild
#   + ONE inline swap: the compaction group's `compaction-basic` row becomes
#   `@jojo/dsh-blackhole/compaction` (the deterministic pi-blackhole backend) —
#   done there because a second `compaction` group or row here would collide
#   with the shipped one (`duplicate loader entry id`), and because replacing
#   the row wholesale means a config key added upstream fails the build instead
#   of being silently dropped
#   + this file's rows (start_process background processes, ast_grep, and the
#   pi-blackhole recall / observational memory / /blackhole* commands)
#
# The FULL preset is the shipped `standard` plus these delta rows. `standard`
# already ships agent-instructions, tool-jobs, tool-web, tool-schedule,
# skill-filesystem + tool-skill, command-compact and tool-result-pruner, so the
# delta is only the three rows below and no row here shares an id with the
# upstream file.
#
# Relationship to `my-ptc`: same three delta rows, different base. `ptc` is
# `standard` + `tool-presentation` (the PTC SDK presentation); everything else
# is identical (verified by diffing the two shipped preset files' plugin ids).
#
# Preset id: the shipped root precedes the user root in discovery and an
# earlier root wins a duplicate id, so a user-root directory named `standard`
# would be shadowed. This preset therefore lives as `my-standard`.
#
# Managed by nix (pkgs/dsh-local/presets.nix): the declaration is generated at
# build time and this file is only the `config.plugins` delta. Relative
# specifiers here are rewritten to absolute package names at build time
# (`.name` resolves through dsh's two anchors), so `./x.js` remains writable.

# ── background processes ────────────────────────────────────────────────────

# The agent-facing half of aliou's pi-processes, ported to dsh's own seams (as
# in my-minimal / my-ptc): `start_process` spawns a long-running command
# without blocking the conversation, registering the handle with the host
# `ctx.jobs` runtime so job_output / job_kill / completion notices all work.
# The `tool-jobs` collection row is already provided by upstream `standard`.
- id: tool-processes
  name: './tool-processes.js'

# ── ast-grep(结构化代码搜索/改写)────────────────────────────────────────────
# 与 my-minimal / my-ptc 同款 `ast_grep` 工具行:tree-sitter AST pattern 搜索 +
# 预览式 rewrite(apply: true 才落盘),走与 bash 相同的 shell seam。无命中 = exit 1,
# 渲染为 (no matches),不当失败。命令必须用 `ast-grep` 全名(本机 `sg` 被 shadow
# 占用,dsh-web 服务 PATH 中 system sw/bin 在前)。文件随 preset 相对说明符加载;
# 与另外两份 preset 共用 toolAstGrepPlugin 的 store 产物(default.nix)。
- id: tool-ast-grep
  name: './tool-ast-grep.js'

# ── pi-blackhole (recall + observational memory + commands) ─────────────────
# The agent-facing half of pi-blackhole beyond the deterministic compaction:
# the `recall` tool (session/file search via the imported pi-blackhole core),
# the observational-memory workers (observer/reflector/dropper, re-expressed
# over dsh's ctx.llm), and the /blackhole* commands. This row sits in the
# agent scope (NOT inside the compaction isolate group); the compaction backend
# swap is applied to the shipped group in presets.nix and imports the same
# bundled core.
- id: blackhole
  name: './dsh-blackhole/lib/index.js'
